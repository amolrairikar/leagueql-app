# Deployed by Terraform (infrastructure/cloudflare) — do NOT `wrangler deploy`.
# This file is only used for `npm run dev` (wrangler dev) and `npm run build`, which bundles
# the worker (incl. @aws-sdk) into dist/ for Terraform to upload. The hourly cron, vars and
# AWS credential secrets are owned by Terraform.
name = "sync-counts"
main = "index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "COUNTS_KV"
id = "15d97bbfce4842aea2e15817010aeb58"

[vars]
AWS_REGION = "us-east-1"
DYNAMODB_TABLE = "leagueql-table-prod"

[observability.logs]
enabled = true
invocation_logs = true

# For local `wrangler dev`, put AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in .dev.vars.
