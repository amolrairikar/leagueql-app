default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages: [pre-commit]

fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-toml
      - id: check-yaml
      - id: detect-aws-credentials
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [chore, docs, feat, fix, refactor, revert, test]
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff linter
        description: "Uses Ruff to lint and fix Python code."
        entry: pipenv run ruff check --fix .
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff formatter
        description: "Uses Ruff to format Python code using standard conventions."
        entry: pipenv run ruff format .
        language: system
        types: [python]
      - id: terraform-format
        name: Terraform formatter
        description: Uses Terraform's built-in format command to format .tf files using standard conventions.
        entry: bash -c "cd infrastructure/modules && terraform fmt"
        language: system
        types: [terraform]
      - id: terraform-validate
        name: Terraform validator
        description: Uses Terraform's built-in validator command to validate .tf files are syntactically correct.
        entry: bash -c "cd infrastructure/modules && terraform validate"
        language: system
        types: [terraform]
      - id: npm-lint
        name: Run npm lint
        description: Runs ESLint (security + React rules, --max-warnings 0) before committing.
        entry: cd frontend && npm run lint
        language: system
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: false
      - id: npm-build
        name: Run npm build
        description: "Runs a forced clean type-check + build (tsc -b --force) so a stale incremental cache can't hide type errors that CI's fresh clone would catch."
        entry: cd frontend && npm run build:ci
        language: system
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: false
