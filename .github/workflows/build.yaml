name: leagueql-app-build-pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  set-env:
    name: Set Environment
    runs-on: ubuntu-latest
    if: github.actor == 'amolrairikar'
    outputs:
      environment: ${{ steps.derive-env.outputs.environment }}
    steps:
      - name: Derive environment
        id: derive-env
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=prod" >> $GITHUB_OUTPUT
          fi

  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: set-env

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install pipenv
        run: python3.13 -m pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run unit tests
        run: pipenv run pytest tests/unit --cov=src --cov-report=term-missing

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Unit Test Coverage"
            echo ""
            pipenv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  run-component-tests:
    name: Run Component Tests - Backend
    runs-on: ubuntu-latest
    needs: set-env
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install pipenv
        run: python3.13 -m pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run component tests
        run: pipenv run behave tests/component -f json -o behave-report.json -f pretty

      - name: Component test summary
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_scripts/behave_summary.py behave-report.json >> "$GITHUB_STEP_SUMMARY"

  run-frontend-tests:
    name: Run Component Tests - Frontend
    runs-on: ubuntu-latest
    needs: set-env
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

  deploy-global:
    name: Deploy Global Infrastructure - ${{ needs.set-env.outputs.environment }}
    runs-on: ubuntu-latest
    needs:
      - set-env
      - run-unit-tests
      - run-component-tests
      - run-frontend-tests
    env:
      ENVIRONMENT: ${{ needs.set-env.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Make AWS credentials script executable
        run: chmod +x scripts/deployment_scripts/configure_aws_credentials.sh

      - name: Configure AWS credentials via OIDC
        run: bash scripts/deployment_scripts/configure_aws_credentials.sh "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-${{ env.ENVIRONMENT }}-role" "us-east-1" "GitHubActions-${{ github.run_id }}"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Make Terraform setup script executable
        run: chmod +x scripts/deployment_scripts/setup_terraform.sh

      - name: Setup Terraform
        run: bash scripts/deployment_scripts/setup_terraform.sh "1.14.7"

      - name: Initialize & Apply Terraform
        working-directory: infrastructure/global/${{ env.ENVIRONMENT }}
        env:
          TF_STATE_BUCKET: terraform-state-bucket-east-${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=leagueql/${{ env.ENVIRONMENT }}/global_tf.state" \
            -backend-config="region=us-east-1"
          terraform apply \
            -auto-approve \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="account_id=${{ secrets.AWS_ACCOUNT_ID }}"

  deploy-fargate-image:
    name: Build & Push Fargate Image - ${{ needs.set-env.outputs.environment }}
    runs-on: ubuntu-latest
    needs:
      - set-env
      - deploy-global  # ECR repo is created by the global stack
    env:
      ENVIRONMENT: ${{ needs.set-env.outputs.environment }}
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Make AWS credentials script executable
        run: chmod +x scripts/deployment_scripts/configure_aws_credentials.sh

      - name: Configure AWS credentials via OIDC
        run: bash scripts/deployment_scripts/configure_aws_credentials.sh "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-${{ env.ENVIRONMENT }}-role" "us-east-1" "GitHubActions-${{ github.run_id }}"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Resolve image metadata
        id: meta
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          # Content-addressed tag: a hash of the image's build inputs — the refresher
          # directory (which includes the Dockerfile + requirements.txt) and the vendored
          # common/ package. git rev-parse HEAD:<dir> is that directory's tree object, so
          # the tag only changes when a file inside changes. As a result the task
          # definition is re-registered only when the image content actually changes, not
          # on every unrelated commit.
          TAG="$( { git rev-parse "HEAD:src/sleeper_player_stats_refresher"; \
                    git rev-parse "HEAD:src/common"; } | sha256sum | cut -c1-12 )"
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com"
          REPO="leagueql-sleeper-player-stats-refresher-${ENVIRONMENT}"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Check whether image already exists in ECR
        id: exists
        run: |
          if aws ecr describe-images --region us-east-1 \
               --repository-name "${{ steps.meta.outputs.repo }}" \
               --image-ids imageTag="${{ steps.meta.outputs.image_tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image tag ${{ steps.meta.outputs.image_tag }} already in ECR — skipping build/push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Amazon ECR
        if: steps.exists.outputs.exists == 'false'
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "${{ steps.meta.outputs.registry }}"

      - name: Build, tag, and push image
        if: steps.exists.outputs.exists == 'false'
        run: |
          IMAGE="${{ steps.meta.outputs.registry }}/${{ steps.meta.outputs.repo }}"
          docker build \
            -f src/sleeper_player_stats_refresher/Dockerfile \
            -t "$IMAGE:${{ steps.meta.outputs.image_tag }}" \
            -t "$IMAGE:latest" \
            ./src
          docker push "$IMAGE:${{ steps.meta.outputs.image_tag }}"
          docker push "$IMAGE:latest"

  deploy-lambda-artifacts:
    name: Deploy Lambda Artifacts - ${{ needs.set-env.outputs.environment }}
    runs-on: ubuntu-latest
    needs:
      - set-env
      - deploy-global
    env:
      ENVIRONMENT: ${{ needs.set-env.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Make AWS credentials script executable
        run: chmod +x scripts/deployment_scripts/configure_aws_credentials.sh

      - name: Configure AWS credentials via OIDC
        run: bash scripts/deployment_scripts/configure_aws_credentials.sh "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-${{ env.ENVIRONMENT }}-role" "us-east-1" "GitHubActions-${{ github.run_id }}"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install pipenv
        run: python3.13 -m pip install pipenv

      - name: Make packaging script executable
        run: chmod +x scripts/deployment_scripts/build_lambda_zip.sh

      - name: Package and upload Lambda functions
        env:
          S3_BUCKET: leagueql-${{ env.ENVIRONMENT }}-bucket
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        # The script self-gates per function: it packages and uploads a Lambda only when
        # the source hash (its dir + the vendored common/) differs from the artifact
        # already in S3, so unchanged functions are neither re-uploaded nor redeployed.
        # NOTE: The script here handles us-east-1 and us-west-2.
        run: bash scripts/deployment_scripts/build_lambda_zip.sh ./src/onboarder ./src/processor ./src/api ./src/player_metadata ./src/sleeper_refresh ./src/stripe_webhook ./src/discord_notifier

  deploy-regional:
    name: Deploy Regional Infrastructure - ${{ needs.set-env.outputs.environment }} - ${{ matrix.region }}
    runs-on: ubuntu-latest
    needs:
      - set-env
      - deploy-lambda-artifacts
      - deploy-fargate-image  # task definition references the pushed image
    env:
      ENVIRONMENT: ${{ needs.set-env.outputs.environment }}

    strategy:
      matrix:
        region: [us-east-1, us-west-2]
      fail-fast: false  # let both regions attempt; don't cancel one if the other fails

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Make AWS credentials script executable
        run: chmod +x scripts/deployment_scripts/configure_aws_credentials.sh

      - name: Configure AWS credentials via OIDC
        run: bash scripts/deployment_scripts/configure_aws_credentials.sh "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-${{ env.ENVIRONMENT }}-role" "${{ matrix.region }}" "GitHubActions-${{ github.run_id }}-${{ matrix.region }}"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Make Terraform setup script executable
        run: chmod +x scripts/deployment_scripts/setup_terraform.sh

      - name: Setup Terraform
        run: bash scripts/deployment_scripts/setup_terraform.sh "1.14.7"

      - name: Set Clerk issuer URL
        run: |
          if [ "${{ env.ENVIRONMENT }}" == "prod" ]; then
            echo "CLERK_ISSUER_URL=${{ secrets.CLERK_ISSUER_URL_PROD }}" >> $GITHUB_ENV
          else
            echo "CLERK_ISSUER_URL=${{ secrets.CLERK_ISSUER_URL_DEV }}" >> $GITHUB_ENV
          fi

      - name: Initialize & Apply Terraform
        working-directory: infrastructure/regional
        env:
          TF_STATE_BUCKET: terraform-state-bucket-${{ matrix.region == 'us-east-1' && 'east' || 'west' }}-${{ secrets.AWS_ACCOUNT_ID }}
          # Stripe billing (BE-015): DEV → sandbox/test mode, PROD → live mode.
          # The sensitive secret key + webhook signing secret are NOT in CI — they
          # live as SecureString SSM parameters (/leagueql/{env}/stripe/*), set
          # out-of-band and fetched by the Lambdas at runtime. Only the
          # non-sensitive Price ID flows through Terraform (TF_VAR_*, no -var flag).
          TF_VAR_stripe_price_id: ${{ env.ENVIRONMENT == 'prod' && secrets.STRIPE_PRICE_ID_PROD || secrets.STRIPE_PRICE_ID_DEV }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=leagueql/${{ env.ENVIRONMENT }}/regional-${{ matrix.region }}-terraform.tfstate" \
            -backend-config="region=${{ matrix.region }}"
          terraform apply \
            -auto-approve \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="aws_region=${{ matrix.region }}" \
            -var="image_tag=${{ needs.deploy-fargate-image.outputs.image_tag }}" \
            -var="clerk_issuer_url=${{ env.CLERK_ISSUER_URL }}" \
            -var="clerk_jwt_audience=${{ secrets.CLERK_JWT_AUDIENCE }}"

  run-sleeper-onboarding-integration-tests:
    name: Run Sleeper Onboarding Integration Tests
    runs-on: ubuntu-latest
    needs:
      - set-env
      - deploy-regional
    if: github.event_name == 'pull_request'
    env:
      ENVIRONMENT: ${{ needs.set-env.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install pipenv
        run: python3.13 -m pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Make AWS credentials script executable
        run: chmod +x scripts/deployment_scripts/configure_aws_credentials.sh

      - name: Configure AWS credentials via OIDC
        run: bash scripts/deployment_scripts/configure_aws_credentials.sh "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-${{ env.ENVIRONMENT }}-role" "us-east-1" "GitHubActions-${{ github.run_id }}"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Resolve dev API base URL
        run: |
          API_BASE_URL=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='leagueql-api-${ENVIRONMENT}-east'].ApiEndpoint" \
            --output text)
          if [ -z "$API_BASE_URL" ]; then
            echo "Could not resolve API endpoint for leagueql-api-${ENVIRONMENT}-east" >&2
            exit 1
          fi
          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

      - name: Run integration tests
        env:
          TEST_SLEEPER_LEAGUE_ID: ${{ secrets.TEST_SLEEPER_LEAGUE_ID }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
          CLERK_SECRET_KEY_SSM_PARAM: /leagueql/${{ env.ENVIRONMENT }}/clerk/secret_key
          TEST_CLERK_USER_ID: ${{ secrets.TEST_CLERK_USER_ID_DEV }}
          CLERK_JWT_TEMPLATE: integration-tests
        run: pipenv run behave tests/integration/sleeper

  run-espn-onboarding-integration-tests:
    name: Run ESPN Onboarding Integration Tests
    runs-on: ubuntu-latest
    needs:
      - set-env
      - deploy-regional
    if: github.event_name == 'pull_request'
    env:
      ENVIRONMENT: ${{ needs.set-env.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install pipenv
        run: python3.13 -m pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Make AWS credentials script executable
        run: chmod +x scripts/deployment_scripts/configure_aws_credentials.sh

      - name: Configure AWS credentials via OIDC
        run: bash scripts/deployment_scripts/configure_aws_credentials.sh "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-${{ env.ENVIRONMENT }}-role" "us-east-1" "GitHubActions-${{ github.run_id }}"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Resolve dev API base URL
        run: |
          API_BASE_URL=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='leagueql-api-${ENVIRONMENT}-east'].ApiEndpoint" \
            --output text)
          if [ -z "$API_BASE_URL" ]; then
            echo "Could not resolve API endpoint for leagueql-api-${ENVIRONMENT}-east" >&2
            exit 1
          fi
          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

      - name: Run ESPN integration tests
        env:
          TEST_ESPN_LEAGUE_ID: ${{ secrets.TEST_ESPN_LEAGUE_ID }}
          TEST_ESPN_SEASON: "2025"
          ESPN_S2_SSM_PARAM: /leagueql/${{ env.ENVIRONMENT }}/espn/s2
          ESPN_SWID_SSM_PARAM: /leagueql/${{ env.ENVIRONMENT }}/espn/swid
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
          CLERK_SECRET_KEY_SSM_PARAM: /leagueql/${{ env.ENVIRONMENT }}/clerk/secret_key
          TEST_CLERK_USER_ID: ${{ secrets.TEST_CLERK_USER_ID_DEV }}
          CLERK_JWT_TEMPLATE: integration-tests
        run: pipenv run behave tests/integration/espn

  run-stripe-billing-integration-tests:
    name: Run Stripe Billing Integration Tests
    runs-on: ubuntu-latest
    needs:
      - set-env
      - deploy-regional
      # Runs after Sleeper onboarding so the test league already exists in
      # DynamoDB for the checkout / billing-portal scenarios to read.
      - run-sleeper-onboarding-integration-tests
    if: github.event_name == 'pull_request'
    env:
      ENVIRONMENT: ${{ needs.set-env.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install pipenv
        run: python3.13 -m pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Make AWS credentials script executable
        run: chmod +x scripts/deployment_scripts/configure_aws_credentials.sh

      - name: Configure AWS credentials via OIDC
        run: bash scripts/deployment_scripts/configure_aws_credentials.sh "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-${{ env.ENVIRONMENT }}-role" "us-east-1" "GitHubActions-${{ github.run_id }}"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Resolve dev API base URL
        run: |
          API_BASE_URL=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='leagueql-api-${ENVIRONMENT}-east'].ApiEndpoint" \
            --output text)
          if [ -z "$API_BASE_URL" ]; then
            echo "Could not resolve API endpoint for leagueql-api-${ENVIRONMENT}-east" >&2
            exit 1
          fi
          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

      # Stripe billing is feature-flagged (BE-017) and the flag lives in AWS
      # AppConfig (runtime). When the deployed config has billing OFF, the
      # endpoints 404 / the webhook no-ops, so the suite is not applicable — skip
      # running it entirely (the suite also self-skips in
      # tests/integration/stripe/environment.py as a local safety net). Ask the
      # deployment itself via the public GET /feature-flags endpoint.
      - name: Check billing feature flag
        id: billing_flag
        run: |
          ENABLED=$(curl -fsS "$API_BASE_URL/feature-flags" | jq -r '.data.billing')
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "Billing feature flag enabled=$ENABLED"

      - name: Run Stripe billing integration tests
        if: steps.billing_flag.outputs.enabled == 'true'
        env:
          TEST_SLEEPER_LEAGUE_ID: ${{ secrets.TEST_SLEEPER_LEAGUE_ID }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
          CLERK_SECRET_KEY_SSM_PARAM: /leagueql/${{ env.ENVIRONMENT }}/clerk/secret_key
          TEST_CLERK_USER_ID: ${{ secrets.TEST_CLERK_USER_ID_DEV }}
          CLERK_JWT_TEMPLATE: integration-tests
          STRIPE_SECRET_KEY_SSM_PARAM: /leagueql/${{ env.ENVIRONMENT }}/stripe/secret_key
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID_DEV }}
        run: pipenv run behave tests/integration/stripe
