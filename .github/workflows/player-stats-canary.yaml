name: leagueql-player-stats-canary

# Live Sleeper player-stats end-to-end canary (BE-011). Kept in its own workflow —
# separate from the commit-triggered build pipeline — so the live Sleeper stats
# endpoint is hit at most once a day on a cron, with no chance of a scheduled run
# triggering the build pipeline's deploy jobs. Runs the deployed refresher Fargate
# task (ECS RunTask) with SEASON + MAX_PLAYERS + OUTPUT_KEY env overrides so the full
# S3-read → live-fetch → S3-write path is validated against a small (~100-player)
# subset in seconds, written to an isolated test key that never clobbers the production
# stats cache. The per-commit logic + S3-wiring coverage lives in tests/unit and
# tests/component; this job is the only path that touches the live stats endpoint and
# the deployed task.

on:
  schedule:
    # 06:15 UTC daily — staggered after the player-metadata canary so the two
    # live Sleeper canaries do not run at the exact same minute.
    - cron: "15 6 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  run-sleeper-player-stats-integration-tests:
    name: Run Sleeper Player Stats Integration Tests
    runs-on: ubuntu-latest
    if: github.actor == 'amolrairikar'
    # The test runs the deployed dev Fargate task and reads/writes the dev bucket, so
    # it needs AWS creds but no deploy. ENVIRONMENT=dev selects the dev cluster +
    # task definition and the dev bucket (leagueql-dev-bucket-east-*).
    env:
      ENVIRONMENT: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install pipenv
        run: python3.13 -m pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Make AWS credentials script executable
        run: chmod +x scripts/deployment_scripts/configure_aws_credentials.sh

      - name: Configure AWS credentials via OIDC
        run: bash scripts/deployment_scripts/configure_aws_credentials.sh "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-${{ env.ENVIRONMENT }}-role" "us-east-1" "GitHubActions-${{ github.run_id }}"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Run player stats integration tests
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: pipenv run behave tests/integration/player_stats
